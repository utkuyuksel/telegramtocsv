<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} · TelegramtoCSV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --panel: #1E293B;
            --panel-2: #273449;
            --border: #334155;
            --text: #E2E8F0;
            --muted: #94A3B8;
            --accent: #38BDF8;
            --accent-2: #0EA5E9;
            --success: #22C55E;
            --warning: #F59E0B;
            --danger: #EF4444;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-2); }
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 24px 16px;
            position: sticky; top: 0;
            height: 100vh;
            display: flex; flex-direction: column;
        }
        .brand {
            font-weight: 700; font-size: 1.1rem;
            display: flex; align-items: center; gap: 10px;
            color: var(--text);
            margin-bottom: 28px;
            padding: 0 8px;
        }
        .brand i { color: var(--accent); }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; border-radius: 8px;
            color: var(--muted); font-weight: 500;
            margin-bottom: 4px;
        }
        .nav-item:hover { background: var(--panel-2); color: var(--text); }
        .nav-item.active { background: var(--accent); color: #0F172A; }
        .nav-item.active:hover { background: var(--accent-2); color: white; }
        .sidebar .bottom { margin-top: auto; }
        .content { flex: 1; padding: 28px 36px; max-width: 100%; }
        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .page-header h1 { font-size: 1.6rem; font-weight: 700; margin: 0; }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
        }
        .stat-card .label {
            font-size: 0.78rem; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .stat-card .value {
            font-size: 1.7rem; font-weight: 700; color: var(--text);
        }
        .stat-card .sub {
            font-size: 0.8rem; color: var(--muted); margin-top: 4px;
        }
        .stat-card .icon {
            float: right; font-size: 1.4rem; opacity: 0.5;
        }
        .badge-status {
            display: inline-block; padding: 3px 10px;
            border-radius: 999px; font-size: 0.75rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .badge-completed { background: rgba(34,197,94,0.18); color: #4ADE80; }
        .badge-processing { background: rgba(56,189,248,0.18); color: #38BDF8; }
        .badge-failed { background: rgba(239,68,68,0.18); color: #F87171; }
        .badge-queued { background: rgba(148,163,184,0.18); color: #CBD5E1; }
        .badge-awaiting_payment { background: rgba(245,158,11,0.18); color: #FBBF24; }
        .badge-free { background: rgba(148,163,184,0.18); color: #CBD5E1; }
        .badge-paid { background: rgba(56,189,248,0.18); color: #38BDF8; }
        table.tg {
            width: 100%; border-collapse: collapse;
        }
        table.tg th {
            text-align: left; font-size: 0.78rem;
            color: var(--muted); text-transform: uppercase;
            letter-spacing: 0.4px; padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }
        table.tg td {
            padding: 14px; font-size: 0.92rem;
            border-bottom: 1px solid var(--border);
        }
        table.tg tr:last-child td { border-bottom: none; }
        table.tg tr:hover td { background: rgba(56,189,248,0.04); }
        .muted { color: var(--muted); }
        .mono { font-family: 'SF Mono', Menlo, monospace; font-size: 0.85rem; }
        .btn-tg {
            background: var(--accent); color: #0F172A;
            border: none; padding: 8px 14px; border-radius: 8px;
            font-weight: 600; font-size: 0.85rem; cursor: pointer;
        }
        .btn-tg:hover { background: var(--accent-2); color: white; }
        .btn-ghost {
            background: transparent; color: var(--muted);
            border: 1px solid var(--border); padding: 6px 12px;
            border-radius: 8px; font-size: 0.85rem; cursor: pointer;
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--accent); }
        .btn-danger {
            background: rgba(239,68,68,0.15); color: var(--danger);
            border: 1px solid rgba(239,68,68,0.3); padding: 5px 10px;
            border-radius: 6px; font-size: 0.78rem; cursor: pointer;
        }
        .btn-danger:hover { background: var(--danger); color: white; }
        .form-control {
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 12px; border-radius: 8px;
            width: 100%; font-size: 0.9rem;
        }
        .form-control:focus {
            outline: none; border-color: var(--accent);
        }
        .form-label {
            font-size: 0.8rem; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.4px;
            margin-bottom: 6px; display: block;
        }
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .flash {
            padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .flash-error { background: rgba(239,68,68,0.15); color: #FCA5A5; border: 1px solid rgba(239,68,68,0.3); }
        .flash-success { background: rgba(34,197,94,0.15); color: #86EFAC; border: 1px solid rgba(34,197,94,0.3); }
        @media (max-width: 768px) {
            .sidebar { width: 64px; padding: 16px 6px; }
            .sidebar .label-text, .sidebar .brand-text { display: none; }
            .content { padding: 18px; }
        }
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-paper-plane"></i>
            <span class="brand-text">TelegramtoCSV</span>
        </div>
        <a href="{{ url_for('admin.dashboard') }}" class="nav-item {% if request.endpoint=='admin.dashboard' %}active{% endif %}">
            <i class="fa-solid fa-gauge-high"></i>
            <span class="label-text">Dashboard</span>
        </a>
        <a href="{{ url_for('admin.orders') }}" class="nav-item {% if request.endpoint=='admin.orders' %}active{% endif %}">
            <i class="fa-solid fa-list-check"></i>
            <span class="label-text">Orders</span>
        </a>
        <a href="{{ url_for('admin.workers') }}" class="nav-item {% if request.endpoint=='admin.workers' %}active{% endif %}">
            <i class="fa-solid fa-users-gear"></i>
            <span class="label-text">Workers</span>
        </a>
        <a href="{{ url_for('admin.payments') }}" class="nav-item {% if request.endpoint=='admin.payments' %}active{% endif %}">
            <i class="fa-solid fa-money-bill-trend-up"></i>
            <span class="label-text">Payments</span>
        </a>
        <div class="bottom">
            <a href="{{ url_for('home') }}" class="nav-item" target="_blank">
                <i class="fa-solid fa-up-right-from-square"></i>
                <span class="label-text">View Site</span>
            </a>
            <a href="{{ url_for('admin.logout') }}" class="nav-item">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span class="label-text">Logout</span>
            </a>
        </div>
    </aside>
    <main class="content">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
                <div class="flash flash-{{ category }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
