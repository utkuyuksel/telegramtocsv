<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login · TelegramtoCSV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            min-height: 100vh; margin: 0;
            display: flex; align-items: center; justify-content: center;
            color: #E2E8F0;
        }
        .login-card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 100%; max-width: 380px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }
        .login-card h1 {
            font-size: 1.4rem; font-weight: 700;
            margin: 0 0 6px 0; display: flex; align-items: center; gap: 10px;
        }
        .login-card h1 i { color: #38BDF8; }
        .login-card .sub { color: #94A3B8; font-size: 0.88rem; margin-bottom: 28px; }
        .form-label {
            display: block; font-size: 0.78rem; color: #94A3B8;
            text-transform: uppercase; letter-spacing: 0.4px;
            margin-bottom: 6px;
        }
        .form-control {
            background: #0F172A; color: #E2E8F0;
            border: 1px solid #334155; padding: 11px 14px;
            border-radius: 8px; width: 100%; font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .form-control:focus { outline: none; border-color: #38BDF8; }
        .btn-login {
            width: 100%; background: #38BDF8; color: #0F172A;
            border: none; padding: 12px; border-radius: 8px;
            font-weight: 600; font-size: 0.95rem; cursor: pointer;
        }
        .btn-login:hover { background: #0EA5E9; color: white; }
        .flash {
            padding: 10px 14px; border-radius: 8px;
            margin-bottom: 18px; font-size: 0.88rem;
            background: rgba(239,68,68,0.15); color: #FCA5A5;
            border: 1px solid rgba(239,68,68,0.3);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1><i class="fa-solid fa-shield-halved"></i> Admin Login</h1>
        <div class="sub">TelegramtoCSV control panel</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, msg in messages %}
                <div class="flash">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="post">
            <label class="form-label">Username</label>
            <input class="form-control" type="text" name="username" autofocus required>
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
            <button class="btn-login" type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
